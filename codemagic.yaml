workflows:
  ios-workflow:
    name: iOS TestFlight Deployment
    integrations:
      app_store_connect: smarttable

    environment:
      groups:
        - teacher_credentials
      vars:
        BUNDLE_ID: "com.smartapleP.in"
        BUILD_VERSION: "2.0.26"
        BUILD_NUMBER: "2"

      ios_signing:
        distribution_type: app_store # or: ad_hoc | development | enterprise
        bundle_identifier: com.smartapleP.in
        # certificates:
        #   - chat_app_distrubutes
        # provisioning_profiles:
        #   - profile_chat_distrubutes_2

      xcode: latest
      flutter: "3.38.0"

    scripts:
        - name: Prepare Flutter
          script: |
            flutter clean
            flutter pub get

        # المستودع عام، فيمكن حقن ملفات Firebase من متغيّرات Codemagic السرّية
        # بدل رفعها. ولو لم تُضبط المتغيّرات يُستعمل الملف المرفوع في المستودع،
        # فيعمل المسارَان معًا. لتوليد القيمة:  base64 -i GoogleService-Info.plist
        - name: Restore Firebase config files
          script: |
            if [ -n "$GOOGLE_SERVICES_INFO_PLIST" ]; then
              echo "$GOOGLE_SERVICES_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist
              echo "GoogleService-Info.plist: من متغيّر البيئة"
            else
              echo "GoogleService-Info.plist: من المستودع"
            fi
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
              echo "google-services.json: من متغيّر البيئة"
            fi

        # الخطوتان اللتان تُعملان عادة بالسحب داخل Xcode: إدراج
        # GoogleService-Info.plist في هدف Runner، وربط Runner.entitlements
        # ليحمل التطبيق حق aps-environment. تفاصيلها في السكربت نفسه.
        - name: Wire Firebase files into Xcode project
          script: |
            ruby -e "require 'xcodeproj'" 2>/dev/null || sudo gem install xcodeproj --no-document
            cd ios
            ruby scripts/configure_firebase.rb
            cd ..

        - name: Initialize Codemagic keychain
          script: keychain initialize

        - name: Import signing certificate into keychain
          script: keychain add-certificates

        - name: Apply provisioning profiles to Xcode project
          script: xcode-project use-profiles

        - name: Install provisioning profiles manually
          script: |
            echo "Installing provisioning profiles"
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            for profile in $CM_PROVISIONING_PROFILE_PATH; do
              cp "$profile" ~/Library/MobileDevice/Provisioning\ Profiles/
            done

        # الـ profile هو ما يقرّر أي الحقوق تبقى في التطبيق بعد التوقيع.
        # فإن خلا من خاصية Push جُرّد aps-environment صامتًا عند التصدير،
        # وخرجت نسخةٌ تعمل ولا تصلها إشعارات. يُكشف هنا قبل البناء لا بعده.
        - name: Verify provisioning profile supports Push
          script: |
            DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
            FOUND=0
            for profile in "$DIR"/*.mobileprovision; do
              [ -f "$profile" ] || continue
              PLIST=$(security cms -D -i "$profile" 2>/dev/null || true)
              echo "$PLIST" | grep -q "$BUNDLE_ID" || continue
              FOUND=1
              if echo "$PLIST" | grep -q 'aps-environment'; then
                echo "✓ الـ profile يحمل خاصية Push لـ $BUNDLE_ID"
                exit 0
              fi
            done
            if [ "$FOUND" = "0" ]; then
              echo "!! لم يُعثر على profile لـ $BUNDLE_ID"
            else
              echo "!! الـ profile الخاص بـ $BUNDLE_ID لا يحمل خاصية Push."
            fi
            echo ""
            echo "الحل — على developer.apple.com:"
            echo "  ١. Identifiers ← $BUNDLE_ID ← فعّل Push Notifications ← Save"
            echo "  ٢. Profiles ← احذف profile التوزيع القديم لهذا المعرّف"
            echo "     (Codemagic يولّد بديلًا يحمل الخاصية في البناء التالي)"
            exit 1

        - name: Configure Xcode project
          script: |
            cd ios
            xcode-project use-targets
            xcode-project set-development-team "MV78XVH867"
            xcode-project update-build-settings --product-bundle-identifier "$BUNDLE_ID"
            cd ..

        # `xcode-project use-targets` و`update-build-settings` أعلاه يعيدان كتابة
        # إعدادات البناء للهدف، فيسقط معها CODE_SIGN_ENTITLEMENTS الذي ضبطته
        # خطوة "Wire Firebase files" في أول المسار. والنتيجة بناءٌ يمرّ بكل
        # الفحوص السابقة -- الـ profile يحمل خاصية Push فعلًا -- ثم يُوقَّع
        # التطبيق بلا الحق، فيردّ أبل وقت التشغيل:
        #   no valid 'aps-environment' entitlement string found for application
        # فيُعاد الربط هنا بعد آخر ما يكتب في إعدادات البناء، ويُتحقَّق منه.
        - name: Re-apply entitlements after build settings rewrite
          script: |
            set -e
            cd ios
            ruby scripts/configure_firebase.rb
            echo "--- CODE_SIGN_ENTITLEMENTS الفعلي قبل البناء ---"
            grep -n 'CODE_SIGN_ENTITLEMENTS' Runner.xcodeproj/project.pbxproj || true
            if ! grep -q 'CODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements'                  Runner.xcodeproj/project.pbxproj; then
              echo "!! الهدف بلا ملف entitlements — سيُوقَّع التطبيق بلا Push."
              exit 1
            fi
            echo "✓ الهدف مربوط بـ Runner.entitlements"
            cd ..

        - name: Update CocoaPods Repo
          script: |
            cd ios
            pod repo update
            pod install --repo-update
            cd ..

        # رقم البناء من عدّاد Codemagic لا من pubspec. كان ثابتًا عند 2.0.21+18
        # في كل بناء، و App Store Connect يرفض رقمًا مستعملًا من قبل: فيُرفض
        # الرفع بصمت ويبقى المختبِر على النسخة القديمة — فيبدو أن كل تصليح
        # لا يعمل، والحقيقة أنه لم يصل الجهاز أصلًا.
        - name: Build IPA for TestFlight
          script: |
            set -e
            BN="${PROJECT_BUILD_NUMBER:-$BUILD_NUMBER}"
            echo "النسخة: $BUILD_VERSION ($BN)"
            flutter build ipa               --build-name="$BUILD_VERSION"               --build-number="$BN"               --export-options-plist=/Users/builder/export_options.plist

        # الإشعارات تفشل صامتةً: التطبيق يعمل، وتظهر نافذة الإذن، ولا يصل شيء.
        # فيُتحقَّق هنا من الحزمة المبنيّة نفسها بدل انتظار شكوى مستخدم، ويسقط
        # البناء قبل الرفع إلى TestFlight إن نقص شرط من شروط APNs.
        - name: Verify push notification setup
          script: |
            set -e
            # الأرشيف قد يحمل الحقّ ويجرّده التصدير عند إعادة التوقيع، فالعبرة
            # بالـ IPA المرفوع فعلًا إلى TestFlight لا بما قبله.
            IPA=$(find build/ios/ipa -name '*.ipa' | head -1)
            [ -n "$IPA" ] || { echo "!! لم يُعثر على ملف IPA"; exit 1; }
            rm -rf /tmp/ipa_check && mkdir -p /tmp/ipa_check
            unzip -q "$IPA" -d /tmp/ipa_check
            APP=$(find /tmp/ipa_check/Payload -maxdepth 1 -name '*.app' | head -1)
            [ -n "$APP" ] || { echo "!! لم يُعثر على .app داخل الـ IPA"; exit 1; }
            echo "الحزمة المُصدَّرة: $APP"
            echo "نسخة هذه الحزمة: $(defaults read "$APP/Info" CFBundleShortVersionString) ($(defaults read "$APP/Info" CFBundleVersion))"
            echo "   قارنها بما تعرضه شاشة «حالة الإشعارات» داخل التطبيق:"
            echo "   إن اختلفتا فالجهاز يشغّل نسخة أقدم ولم يصله التصليح."

            # ١) بلا هذا الملف داخل الحزمة يفشل Firebase.initializeApp وقت
            #    التشغيل، فلا يصدر رمز جهاز أصلًا.
            if [ -f "$APP/GoogleService-Info.plist" ]; then
              echo "✓ GoogleService-Info.plist داخل الحزمة"
            else
              echo "!! GoogleService-Info.plist غير موجود داخل الحزمة"
              exit 1
            fi

            # ٢) الحقّ لا يكفي وجوده في الملف: العبرة بما وُقّع فعلًا.
            ENT=$(codesign -d --entitlements :- "$APP" 2>/dev/null || true)
            if echo "$ENT" | grep -q 'aps-environment'; then
              echo "✓ aps-environment موقّع في التطبيق:"
              echo "$ENT" | grep -A1 'aps-environment'
            else
              echo "!! التطبيق موقّع بلا aps-environment — لن يسجَّل في APNs."
              echo "   فعّل Push Notifications على معرّف $BUNDLE_ID في"
              echo "   developer.apple.com ثم أعد توليد الـ provisioning profile."
              exit 1
            fi

            # ٣) وحتى لو وُقّع، لا يعمل إن كان الـ profile لا يحمل الخاصية.
            PROFILE="$APP/embedded.mobileprovision"
            if [ -f "$PROFILE" ]; then
              if security cms -D -i "$PROFILE" | grep -q 'aps-environment'; then
                echo "✓ الـ provisioning profile يحمل خاصية Push"
              else
                echo "!! الـ provisioning profile بلا خاصية Push"
                exit 1
              fi
            fi

            echo "إعداد الإشعارات سليم في هذه النسخة."


    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

      email:
        recipients:
          - mahmoud.hassan.ahmed3@gmail.com
