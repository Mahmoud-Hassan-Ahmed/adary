workflows:
  ios-workflow:
    name: iOS TestFlight Deployment
    integrations:
      app_store_connect: smarttable

    environment:
      groups:
        - teacher_credentials
      vars:
        BUNDLE_ID: "com.smartapleP.in"
        # The public version comes from `version:` in pubspec.yaml (CFBundleShortVersionString).
        # The build number is queried from TestFlight at build time, see the build step below.

      ios_signing:
        distribution_type: app_store # or: ad_hoc | development | enterprise
        bundle_identifier: com.smartapleP.in
        # certificates:
        #   - chat_app_distrubutes
        # provisioning_profiles:
        #   - profile_chat_distrubutes_2

      xcode: latest
      flutter: "3.38.0"

    scripts:
        - name: Prepare Flutter
          script: |
            flutter clean
            flutter pub get

        - name: Fetch rive_native iOS libraries
          script: |
            # rive_native (via awesome_dialog -> rive) downloads its prebuilt libs from an
            # Xcode script phase that runs with the working directory set to ios/Pods, where
            # `dart run` finds no pubspec.yaml and fails the archive. Running it here from the
            # project root downloads the libs and writes the marker file the phase checks,
            # so the phase skips itself during the build.
            dart run rive_native:setup --verbose --platform ios

        - name: Initialize Codemagic keychain
          script: keychain initialize

        - name: Import signing certificate into keychain
          script: keychain add-certificates

        - name: Apply provisioning profiles to Xcode project
          script: xcode-project use-profiles

        - name: Install provisioning profiles manually
          script: |
            echo "Installing provisioning profiles"
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            for profile in $CM_PROVISIONING_PROFILE_PATH; do
              cp "$profile" ~/Library/MobileDevice/Provisioning\ Profiles/
            done

        - name: Configure Xcode project
          script: |
            cd ios
            xcode-project use-targets
            xcode-project set-development-team "MV78XVH867"
            xcode-project update-build-settings --product-bundle-identifier "$BUNDLE_ID"
            cd ..

        - name: Update CocoaPods Repo
          script: |
            cd ios
            pod repo update
            pod install --repo-update
            cd ..

        - name: Build IPA for TestFlight
          script: |
            set -e
            # App Store Connect rejects any upload whose CFBundleVersion is not strictly higher
            # than the last one on TestFlight, so read the current value instead of hardcoding it.
            APP_APPLE_ID=$(app-store-connect apps list \
              --bundle-id-identifier "$BUNDLE_ID" \
              --strict-match-identifier \
              --json | jq -r '(.data // .) | .[0].id')

            if [ -z "$APP_APPLE_ID" ] || [ "$APP_APPLE_ID" = "null" ]; then
              echo "Could not resolve the App Store Connect app id for $BUNDLE_ID"
              exit 1
            fi

            # --all-versions: highest build across every version train, not just the newest one,
            # so the number keeps climbing even when the public version changes.
            LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number \
              "$APP_APPLE_ID" --platform IOS --all-versions || echo "")
            NEXT_BUILD_NUMBER=$(( ${LATEST_BUILD_NUMBER:-0} + 1 ))

            echo "Latest build on TestFlight: ${LATEST_BUILD_NUMBER:-none}. Building $NEXT_BUILD_NUMBER."
            flutter build ipa \
              --build-number="$NEXT_BUILD_NUMBER" \
              --export-options-plist=/Users/builder/export_options.plist


    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

      email:
        recipients:
          - mahmoud.hassan.ahmed3@gmail.com
